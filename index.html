<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch-A-Sketch</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>


    <h2 class=title>Etch-a-Sketch</h2>


    <div class="etchMain">
        <div class="color">
            <button class="blackBtn">BLACK</button>
            <button class="redBtn">RED</button>
            <button class="yellowBtn">YELLOW</button>
            <button class="blueBtn">BLUE</button>
            <button class="whiteBtn">WHITE</button>
            <button class="lightBlueBtn">LIGHT BLUE</button>
        </div>
        <div class="etch"></div>
        <div class="tools">
            <button class="sixteen">16x16</button>
            <button class="thirtyTwo">32x32</button>
            <button class="fourtyEight">48x48</button>
            <button class="sixtyFour">64x64</button>
            <button class="eighty">80x80</button>
            <button class="custom">CUSTOM</button>
        </div>
    </div>
    <footer>
        <h6>Zoom Incorporated 2026© // All Rights Reserved.</h6>
    </footer>


















    <script src="scripts.js" defer></script>
</body>

</html>
